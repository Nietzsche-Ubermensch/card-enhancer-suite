[tox]
envlist = mypy, flake8, pytest

[testenv]
deps = pytest>=7.4.0
commands = pytest tests/

[testenv:mypy]
deps = mypy>=1.0.0
commands = mypy gigapixel card_enhancer elan --ignore-missing-imports

[testenv:flake8]
deps = flake8>=6.0.0
commands = flake8 gigapixel card_enhancer elan --max-line-length=100

[flake8]
max-line-length = 100
